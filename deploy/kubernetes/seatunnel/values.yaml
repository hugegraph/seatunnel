# Standalone is one long-running hybrid engine, not a local one-job process.
# Cluster starts the upstream separated master and worker Deployments.
mode: cluster
fullnameOverride: ""
clusterDomain: cluster.local

global:
  imageRegistry: ""
image:
  # Upstream calls this registry; it is the full image repository.
  registry: apache/seatunnel
  tag: "3.0.0"
  digest: ""
  pullPolicy: IfNotPresent
  pullSecret: ""

configMap:
  create: true
  existingConfigMapName: ""
  # Complete per-file replacements. Values are evaluated as Helm templates.
  data: {}
# Merged into the upstream seatunnel.engine configuration. service.port owns the
# HTTP listener. The default local checkpoint directory is for trials only.
engineConfig: {}
service:
  type: ClusterIP
  port: 8080
  annotations: {}
serviceAccount:
  create: true
  name: ""
  annotations: {}
# DNS discovery does not need Kubernetes API access or a service-account token.
env: []
extraVolumes: []
extraVolumeMounts: []
podSecurityContext: {}
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]
  seccompProfile:
    type: RuntimeDefault
terminationGracePeriodSeconds: 120

master:
  # Unset derives 1 in standalone and 2 in cluster. Standalone requires 1.
  replicas:
  command: []
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  annotations: {}
  affinity: {}
  nodeSelector: {}
  tolerations: []
  resources: {}
  startupProbe:
    tcpSocket:
      port: hazelcast-port
    periodSeconds: 5
    timeoutSeconds: 5
    failureThreshold: 60
  readinessProbe:
    tcpSocket:
      port: master-port
    periodSeconds: 10
    timeoutSeconds: 5
  livenessProbe:
    tcpSocket:
      port: hazelcast-port
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 3
worker:
  replicas: 2
  command: []
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  annotations: {}
  affinity: {}
  nodeSelector: {}
  tolerations: []
  resources: {}
  startupProbe:
    tcpSocket:
      port: hazelcast-port
    periodSeconds: 5
    timeoutSeconds: 5
    failureThreshold: 60
  readinessProbe:
    tcpSocket:
      port: hazelcast-port
    periodSeconds: 10
    timeoutSeconds: 5
  livenessProbe:
    tcpSocket:
      port: hazelcast-port
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 3
